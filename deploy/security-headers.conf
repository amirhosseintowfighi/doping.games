# Included in every location (nginx drops server-level add_header when a location adds its own).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Only this site's own files, plus the public-IP lookup used by the DNS page. Inline styles are
# needed for React style attributes; there are no inline scripts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.ipify.org; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
